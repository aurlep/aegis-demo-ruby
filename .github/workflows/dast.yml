# Generated by Aegis. Review before committing.
# Set repository secrets DAST_USERNAME and DAST_PASSWORD.
# Set DAST_TARGET_URL if you scan a deployed environment; leave it unset
# to scan an app this workflow starts itself, and edit 'Start the
# application' to bring it up. The scan runs the plan in .zap/plan.yaml.
name: dast
'on':
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DAST_TARGET_URL: ${{ secrets.DAST_TARGET_URL || 'http://127.0.0.1:4567' }}
      DAST_TARGET_REMOTE: ${{ secrets.DAST_TARGET_URL != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Start the application
        if: env.DAST_TARGET_REMOTE != 'true'
        run: 'echo ''EDIT: start your app so it listens on $DAST_TARGET_URL'';

          docker compose up -d --wait || true'
      - name: Wait for the target
        run: "timeout 90 bash -c \"until curl -sfk \\\"$DAST_TARGET_URL\\\" >/dev/null;\
          \ do sleep 3; done\" || {\n  echo \"::error::$DAST_TARGET_URL never answered;\
          \ not running a scan that would report nothing.\"; exit 1;\n}"
      - name: Run ZAP authenticated scan
        run: "set +e\ndocker run --network host -u root -v ${{ github.workspace }}:/zap/wrk/:rw\
          \ -v ${{ github.workspace }}/zaphome:/root/.ZAP:rw -e DAST_TARGET_URL -e\
          \ DAST_USERNAME -e DAST_PASSWORD ghcr.io/zaproxy/zaproxy:stable zap.sh -cmd\
          \ -port 8090 -autorun /zap/wrk/.zap/plan.yaml\nzap_status=$?\nset -e\nmv\
          \ results.sarif.json results.sarif 2>/dev/null || true\nif [ ! -s results.sarif\
          \ ]; then\n  echo \"::error::ZAP produced no report (exit $zap_status)\"\
          \n  exit 1\nfi\necho \"ZAP exited $zap_status; report written\""
        env:
          DAST_USERNAME: ${{ secrets.DAST_USERNAME }}
          DAST_PASSWORD: ${{ secrets.DAST_PASSWORD }}
      - name: Send findings to Aegis
        if: always()
        run: "report=\"results.sarif\"\nif [ ! -s \"$report\" ]; then\n  echo \"::warning\
          \ title=Aegis ingest skipped::zap: $report is missing or empty - nothing\
          \ to send\"\n  echo \"- \\`zap\\`: no report produced\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  exit 0\nfi\nif command -v curl >/dev/null 2>&1; then\n  code=$(curl\
          \ -sS -o aegis-response.json -w '%{http_code}' --max-time 60 -X POST \"\
          $AEGIS_URL/api/v1/repositories/dd320b16-b0a8-4fb7-abe4-78121e03e74c/findings:ingest?scanner=zap\"\
          \ -H \"Authorization: Aegis-CI $AEGIS_INGEST_TOKEN\" -H \"X-Aegis-Organization:\
          \ cdae4877-0fcd-4ff4-9fc2-29948ccfed0d\" -H \"Content-Type: application/json\"\
          \ --data-binary @\"$report\") || code=000\nelif command -v wget >/dev/null\
          \ 2>&1; then\n  if wget -q -O aegis-response.json --header=\"Authorization:\
          \ Aegis-CI $AEGIS_INGEST_TOKEN\" --header=\"X-Aegis-Organization: cdae4877-0fcd-4ff4-9fc2-29948ccfed0d\"\
          \ --header=\"Content-Type: application/json\" --post-file=\"$report\" \"\
          $AEGIS_URL/api/v1/repositories/dd320b16-b0a8-4fb7-abe4-78121e03e74c/findings:ingest?scanner=zap\"\
          ; then code=202; else code=wget-failed; fi\nelse\n  code=no-http-client\n\
          fi\nif [ \"$code\" = \"202\" ]; then\n  echo \"- \\`zap\\`: accepted by\
          \ Aegis\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"::warning title=Aegis\
          \ ingest failed::zap: $code - these findings did not reach the hub\"\n \
          \ echo \"- \\`zap\\`: **not** sent to Aegis ($code)\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  head -c 500 aegis-response.json >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null\
          \ || true\nfi"
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zap-report
          path: results.sarif
