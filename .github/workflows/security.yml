# Generated by Aegis. Review before committing.
# Actions are pinned to commit SHAs (Dependabot keeps them current); each
# job reports rather than fails the build -- tighten once findings are triaged.
name: security
'on':
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Report (Semgrep)
        run: semgrep scan --config p/default --sarif --output results.sarif
        env:
          SEMGREP_SEND_METRICS: 'off'
      - name: Send findings to Aegis
        if: always()
        run: "report=\"results.sarif\"\nif [ ! -s \"$report\" ]; then\n  echo \"::warning\
          \ title=Aegis ingest skipped::semgrep: $report is missing or empty - nothing\
          \ to send\"\n  echo \"- \\`semgrep\\`: no report produced\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  exit 0\nfi\nif command -v curl >/dev/null 2>&1; then\n  code=$(curl\
          \ -sS -o aegis-response.json -w '%{http_code}' --max-time 60 -X POST \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=semgrep\"\
          \ -H \"Authorization: Aegis-CI $AEGIS_INGEST_TOKEN\" -H \"X-Aegis-Organization:\
          \ 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\" -H \"Content-Type: application/json\"\
          \ --data-binary @\"$report\") || code=000\nelif command -v wget >/dev/null\
          \ 2>&1; then\n  if wget -q -O aegis-response.json --header=\"Authorization:\
          \ Aegis-CI $AEGIS_INGEST_TOKEN\" --header=\"X-Aegis-Organization: 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\"\
          \ --header=\"Content-Type: application/json\" --post-file=\"$report\" \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=semgrep\"\
          ; then code=202; else code=wget-failed; fi\nelse\n  code=no-http-client\n\
          fi\nif [ \"$code\" = \"202\" ]; then\n  echo \"- \\`semgrep\\`: accepted\
          \ by Aegis\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"::warning title=Aegis\
          \ ingest failed::semgrep: $code - these findings did not reach the hub\"\
          \n  echo \"- \\`semgrep\\`: **not** sent to Aegis ($code)\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  head -c 500 aegis-response.json >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null\
          \ || true\nfi"
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: semgrep-report
          path: results.sarif
  trivy:
    name: Dependencies, secrets & IaC (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.58.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Trivy)
        run: trivy fs --scanners vuln,secret,misconfig --format sarif --output results.sarif
          --exit-code 0 .
      - name: Send findings to Aegis
        if: always()
        run: "report=\"results.sarif\"\nif [ ! -s \"$report\" ]; then\n  echo \"::warning\
          \ title=Aegis ingest skipped::trivy: $report is missing or empty - nothing\
          \ to send\"\n  echo \"- \\`trivy\\`: no report produced\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  exit 0\nfi\nif command -v curl >/dev/null 2>&1; then\n  code=$(curl\
          \ -sS -o aegis-response.json -w '%{http_code}' --max-time 60 -X POST \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=trivy\"\
          \ -H \"Authorization: Aegis-CI $AEGIS_INGEST_TOKEN\" -H \"X-Aegis-Organization:\
          \ 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\" -H \"Content-Type: application/json\"\
          \ --data-binary @\"$report\") || code=000\nelif command -v wget >/dev/null\
          \ 2>&1; then\n  if wget -q -O aegis-response.json --header=\"Authorization:\
          \ Aegis-CI $AEGIS_INGEST_TOKEN\" --header=\"X-Aegis-Organization: 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\"\
          \ --header=\"Content-Type: application/json\" --post-file=\"$report\" \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=trivy\"\
          ; then code=202; else code=wget-failed; fi\nelse\n  code=no-http-client\n\
          fi\nif [ \"$code\" = \"202\" ]; then\n  echo \"- \\`trivy\\`: accepted by\
          \ Aegis\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"::warning title=Aegis\
          \ ingest failed::trivy: $code - these findings did not reach the hub\"\n\
          \  echo \"- \\`trivy\\`: **not** sent to Aegis ($code)\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  head -c 500 aegis-response.json >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null\
          \ || true\nfi"
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-report
          path: results.sarif
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Gitleaks)
        run: gitleaks detect --source . --report-format sarif --report-path results.sarif
          --exit-code 0 --no-banner
      - name: Send findings to Aegis
        if: always()
        run: "report=\"results.sarif\"\nif [ ! -s \"$report\" ]; then\n  echo \"::warning\
          \ title=Aegis ingest skipped::gitleaks: $report is missing or empty - nothing\
          \ to send\"\n  echo \"- \\`gitleaks\\`: no report produced\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  exit 0\nfi\nif command -v curl >/dev/null 2>&1; then\n  code=$(curl\
          \ -sS -o aegis-response.json -w '%{http_code}' --max-time 60 -X POST \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=gitleaks\"\
          \ -H \"Authorization: Aegis-CI $AEGIS_INGEST_TOKEN\" -H \"X-Aegis-Organization:\
          \ 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\" -H \"Content-Type: application/json\"\
          \ --data-binary @\"$report\") || code=000\nelif command -v wget >/dev/null\
          \ 2>&1; then\n  if wget -q -O aegis-response.json --header=\"Authorization:\
          \ Aegis-CI $AEGIS_INGEST_TOKEN\" --header=\"X-Aegis-Organization: 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\"\
          \ --header=\"Content-Type: application/json\" --post-file=\"$report\" \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=gitleaks\"\
          ; then code=202; else code=wget-failed; fi\nelse\n  code=no-http-client\n\
          fi\nif [ \"$code\" = \"202\" ]; then\n  echo \"- \\`gitleaks\\`: accepted\
          \ by Aegis\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"::warning title=Aegis\
          \ ingest failed::gitleaks: $code - these findings did not reach the hub\"\
          \n  echo \"- \\`gitleaks\\`: **not** sent to Aegis ($code)\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  head -c 500 aegis-response.json >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null\
          \ || true\nfi"
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-report
          path: results.sarif
  hadolint:
    name: Container (Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: results.sarif
          no-fail: true
      - name: Send findings to Aegis
        if: always()
        run: "report=\"results.sarif\"\nif [ ! -s \"$report\" ]; then\n  echo \"::warning\
          \ title=Aegis ingest skipped::hadolint: $report is missing or empty - nothing\
          \ to send\"\n  echo \"- \\`hadolint\\`: no report produced\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  exit 0\nfi\nif command -v curl >/dev/null 2>&1; then\n  code=$(curl\
          \ -sS -o aegis-response.json -w '%{http_code}' --max-time 60 -X POST \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=hadolint\"\
          \ -H \"Authorization: Aegis-CI $AEGIS_INGEST_TOKEN\" -H \"X-Aegis-Organization:\
          \ 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\" -H \"Content-Type: application/json\"\
          \ --data-binary @\"$report\") || code=000\nelif command -v wget >/dev/null\
          \ 2>&1; then\n  if wget -q -O aegis-response.json --header=\"Authorization:\
          \ Aegis-CI $AEGIS_INGEST_TOKEN\" --header=\"X-Aegis-Organization: 7b5b6e10-f2c2-4e6e-83fb-41c999b01d47\"\
          \ --header=\"Content-Type: application/json\" --post-file=\"$report\" \"\
          $AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=hadolint\"\
          ; then code=202; else code=wget-failed; fi\nelse\n  code=no-http-client\n\
          fi\nif [ \"$code\" = \"202\" ]; then\n  echo \"- \\`hadolint\\`: accepted\
          \ by Aegis\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"::warning title=Aegis\
          \ ingest failed::hadolint: $code - these findings did not reach the hub\"\
          \n  echo \"- \\`hadolint\\`: **not** sent to Aegis ($code)\" >> \"$GITHUB_STEP_SUMMARY\"\
          \n  head -c 500 aegis-response.json >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null\
          \ || true\nfi"
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hadolint-report
          path: results.sarif
