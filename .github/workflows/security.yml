# Generated by Aegis. Review before committing.
# Actions are pinned to commit SHAs (Dependabot keeps them current); each
# job reports rather than fails the build -- tighten once findings are triaged.
name: security
'on':
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  trivy:
    name: Dependencies, secrets & IaC (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.58.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Trivy)
        run: trivy fs --scanners vuln,secret,misconfig --format sarif --output results.sarif
          --exit-code 0 .
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=trivy"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-report
          path: results.sarif
  checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          output_format: sarif
          output_file_path: results.sarif
          soft_fail: true
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=checkov"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: checkov-report
          path: results.sarif
  hadolint:
    name: Container (Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: results.sarif
          no-fail: true
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=hadolint"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hadolint-report
          path: results.sarif
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Gitleaks)
        run: gitleaks detect --source . --report-format sarif --report-path results.sarif
          --exit-code 0 --no-banner
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=gitleaks"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-report
          path: results.sarif
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Report (Semgrep)
        run: semgrep scan --config p/default --sarif --output results.sarif
        env:
          SEMGREP_SEND_METRICS: 'off'
      - name: Send findings to Aegis
        if: always()
        run: 'curl -sf -X POST "$AEGIS_URL/api/v1/repositories/f6e114ee-d63a-4e10-8138-46a47de1b31c/findings:ingest?scanner=semgrep"
          -H "Authorization: Aegis-CI $AEGIS_INGEST_TOKEN" -H "X-Aegis-Organization:
          7b5b6e10-f2c2-4e6e-83fb-41c999b01d47" -H "Content-Type: application/json"
          --data-binary @results.sarif || echo ''Aegis ingest skipped (unreachable)'''
        env:
          AEGIS_URL: ${{ secrets.AEGIS_URL }}
          AEGIS_INGEST_TOKEN: ${{ secrets.AEGIS_INGEST_TOKEN }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: semgrep-report
          path: results.sarif
