# Generated by Aegis from a recorded login flow. Review before committing.
# Authentication method: form. ZAP logs in, then spiders
# and active-scans behind it. Credentials come from CI secrets, never this file.
#
# Recorded steps:
env:
  contexts:
    - name: app
      urls:
        - ${DAST_TARGET_URL}
      includePaths:
        - ${DAST_TARGET_URL}.*
      authentication:
        method: form
        parameters:
          loginPageUrl: ${DAST_TARGET_URL}/login
          loginRequestUrl: ${DAST_TARGET_URL}/login
          loginRequestBody: email={%username%}&password={%password%}
        verification:
          method: autodetect
      sessionManagement:
        method: cookie
      users:
        - name: recorded-user
          credentials:
            username: ${DAST_USERNAME}
            password: ${DAST_PASSWORD}
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: spider
    parameters:
      context: app
      maxDuration: 5
      user: recorded-user
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: app
      maxRuleDurationInMins: 3
      user: recorded-user
  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk
      reportFile: results.sarif
